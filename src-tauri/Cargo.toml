[package]
name = "agent-skill-studio"
version = "0.1.0"
description = "A local desktop workspace for Codex Skills."
edition = "2021"
rust-version = "1.85"

[workspace]
members = [".", "crates/skill-bundle-core"]
resolver = "2"

[lib]
name = "agent_skill_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "agent-skill-studio"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", default-features = false, features = ["apple-native"] }
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
skill-bundle-core = { path = "crates/skill-bundle-core" }
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
