[package]
name = "skill-bundle-core"
version = "0.1.0"
description = "Portable Skill Bundle format verification for Agent Skill Studio."
edition = "2021"
rust-version = "1.85"

[dependencies]
caseless = "=0.2.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "=0.1.25"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
crc32fast = "=1.5.0"
